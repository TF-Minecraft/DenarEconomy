name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned dependencies
        env:
          GH_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: bash .github/scripts/prepare-release.sh
      - name: Verify
        run: mvn -B --no-transfer-progress clean verify
      - uses: actions/upload-artifact@v7
        with:
          name: denareconomy-${{ github.sha }}
          path: target/denareconomy-*.jar
          if-no-files-found: error
