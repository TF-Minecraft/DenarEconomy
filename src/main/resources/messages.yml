# All player-facing text.
# Colours: & codes (&a, &e, &6) and #rrggbb hex both work.
# %prefix% expands to the prefix below (empty by default); the other %placeholders% are filled in by the plugin.

prefix: ""

general:
  players-only: "Only players can use this command."
  unknown-subcommand: "%prefix%&cUnknown subcommand or wrong usage."
  reload-ok: "%prefix%&aReloaded coins, drops, and messages."

errors:
  no-amount: "%prefix%&cNo amount specified"
  invalid-amount: "%prefix%&cInvalid amount"
  not-enough-pouch: "%prefix%#a33d1dYour pouch does not hold that much."
  no-coin-in-hand: "%prefix%&cHold coins to put them in your pouch."
  world-payout: "%prefix%&cDrop that coin and pick it up."
  not-enough-bank: "%prefix%#a33d1dThe banker finds too little in your account."
  pouch-cooldown: "%prefix%&cWait %seconds%s before using that again."
  item-chain-broken: "Error: First money item not initialized."
  no-permission: "%prefix%&cYou do not have permission to do that."
  unknown-coin: "%prefix%&cUnknown coin."
  invalid-count: "%prefix%&cAmount must be a whole number of coins."
  coins-unavailable: "%prefix%&cThat sum cannot be counted out in coin. Your pouch has not been charged."
  give-usage: "%prefix%&cUsage: /deco give <player> <amount> [bank|pouch]"
  unknown-player: "%prefix%&c%player% is not online playing a character."
  give-failed: "%prefix%&cCould not pay %player%. Their balance has not changed."
  no-character: "%prefix%#a33d1dYou carry no purse until you take up a character."
  ledger-unavailable: "%prefix%&cThe bankers' ledger is closed. Nothing has changed."

balance:
  pouch: "#3ce8c9Current Pouch Balance: #b39122%amount%#dbaf1dd"
  bank: "#3ce8c9Current Bank Balance: #b39122%amount%#dbaf1dd"

pouch:
  showing: "&6Showing %amount%d..."
  hologram: "&6Balance: %amount%d"

baltop:
  header: "&e========== &6[Balance Top %limit%] &e=========="
  entry: "&a%rank% &e%name% &7- #b39122%amount%#dbaf1dd"
  footer: "&e=================================="

bank:
  header: "&e============&6[Bank Report]&e=============="
  action: "#6ab05a%action%: #b39122%amount%#dbaf1dd"
  new-bank: "#3ce8c9New Bank Balance: #b39122%amount%#dbaf1dd"
  new-pouch: "#3ce8c9New Pouch Balance: #b39122%amount%#dbaf1dd"
  footer: "&e====================================="
  deposited: "Deposited"
  withdrew: "Withdrew"

give:
  sent: "%prefix%&aGave #b39122%amount%#dbaf1dd &ato %player%'s %account%."
  received: "#dbaf1d+#b39122%amount%#dbaf1dd #3ce8c9added to your %account%."

history:
  header: "&e====== &6[Ledger of %player%] &7last %count% &e======"
  entry: "&7%time% &e%reason%&7: %changes%"
  change: "%account% #b39122%amount%#dbaf1dd"

legacy:
  header: "&e====== &6[Unclaimed legacy money] &7%count% accounts &e======"
  entry: "&e%name% &7%account%: pouch #b39122%pouch%#dbaf1dd&7, bank #b39122%bank%#dbaf1dd"
  usage: "%prefix%&cUsage: /deco legacy [assign <account uuid> <character uuid>]"
  not-owner: "%prefix%&cCharacter %character% is not a character of account %account%."
  nothing: "%prefix%&cAccount %account% has no unclaimed legacy money."
  failed: "%prefix%&cCould not assign the legacy money of %account% (%result%). Nothing has changed."
  assigned: "%prefix%&aMoved the legacy money of %account% to character %character%."

account:
  usage: "%prefix%&cUsage: /deco account <character name|id>"
  unknown: "%prefix%&cNo character %character% was found."
  several: "%prefix%&e%count% characters are called %character%. Use an id:"
  match: "&7%id% &e%name% &7(%status%)"
  header: "&e====== &6[%name%] &7%status% %id% &e======"
  balances: "#3ce8c9Pouch #b39122%pouch%#dbaf1dd&7, bank #b39122%bank%#dbaf1dd"

move:
  usage: "%prefix%&cUsage: /deco move <from account> <to account> <cents> <note>"
  bad-account: "%prefix%&c%account% is not a ledger account."
  guild-short: "%prefix%&c%account% holds only %balance%. A move may not take a guild below zero."
  failed: "%prefix%&cThe move was not applied (%result%). Nothing has changed."
  moved: "%prefix%&aMoved #b39122%amount%#dbaf1dd &afrom %from% to %to%."

money:
  earned: "#dbaf1d+#b39122%amount%#dbaf1dd"
  tax: "#44524f(%tax% in tax)"
  coin-name: "#b39122%amount%#dbaf1dd"
